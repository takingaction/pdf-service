# Render Blueprint
# See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pdf-service
    region: oregon
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
