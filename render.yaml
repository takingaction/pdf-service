# Render Blueprint - pdf-service with Docker
# See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pdf-service
    region: oregon
    plan: starter
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: APP_URL
        value: "https://bh-curriculum-management.vercel.app"
